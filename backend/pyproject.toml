[project]
name = "school-summary-backend"
version = "0.1.0"
description = "FastAPI backend for the Bakalari school dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "watchfiles>=1.0",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Pyflakes + the pycodestyle rules that catch real mistakes.
# Style-only rule sets (I, UP, B) are intentionally left out for now.
select = ["E4", "E7", "E9", "F", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require real API credentials",
]
