x-hardening: &hardening
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  backend:
    <<: *hardening
    build: ./backend
    container_name: school-summary-backend
    # The mounted app_data dir must be writable by this uid:gid, e.g.
    #   chown -R 10001:10001 ${PATH_TO_APPDATA}/school-summary
    # or set APP_UID/APP_GID to the directory's current owner.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${PATH_TO_APPDATA}/school-summary:/app/app_data
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      - APP_DATA_DIR=/app/app_data
    pids_limit: 256
    mem_limit: 1g
    # Healthcheck comes from the image (GET /api/health)

  frontend:
    <<: *hardening
    build: ./frontend
    container_name: school-summary-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 128
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
    # Healthcheck comes from the image (GET /healthz)
